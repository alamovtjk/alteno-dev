  <body>

    <style>
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #fff url('/splash/splash-mobile.webp') center/cover no-repeat;
        transition: opacity .45s ease;
      }
      @media (min-width: 601px) {
        #splash { background-image: url('/splash/splash-desktop.webp'); }
      }
      #splash.sp-out { opacity: 0; pointer-events: none; }
    </style>

    <div id="splash"></div>

    <script>
      /* Сплэш уходит, как только приложение отрисовалось (main.jsx зовёт
         __hideSplash), а не по фиксированному таймеру. MIN — чтобы на быстрой
         сети он не мигнул, MAX — страховка, если скрипт приложения не выполнится. */
      (function () {
        var START = Date.now(), MIN = 550, MAX = 4000, done = false;
        function hide() {
          if (done) return;
          done = true;
          setTimeout(function () {
            var s = document.getElementById('splash');
            if (!s) return;
            s.classList.add('sp-out');
            setTimeout(function () { s.remove(); }, 450);
          }, Math.max(0, MIN - (Date.now() - START)));
        }
        window.__hideSplash = hide;
        setTimeout(hide, MAX);
      })();
    </script>

    <script>
      /* Самолечение кеша.
         Service worker мог сохранить HTML-страницу под адресом скрипта — тогда
         модуль не грузится и сайт не стартует, а сам по себе кеш не починится.
         Ловим ошибку загрузки скрипта, сносим воркер со всеми кешами и
         перезагружаемся один раз (флаг в sessionStorage от зацикливания). */
      (function () {
        var KEY = 'sw_selfheal';
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (!el || el.tagName !== 'SCRIPT') return;
          if (sessionStorage.getItem(KEY)) return;
          sessionStorage.setItem(KEY, '1');

          var jobs = [];
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches) {
            jobs.push(caches.keys().then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            }));
          }
          Promise.all(jobs).catch(function () {}).then(function () {
            location.reload();
          });
        }, true);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
